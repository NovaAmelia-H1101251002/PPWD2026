<!DOCTYPE html>
<html>
    <head>
        <title>Deret Ganjil Aesthetic</title>
        <style>
            body {
                font-family: system-ui, -apple-system, sans-serif; 
                /* Gradient background dari warna EAD392 ke F5ABA4 */
                background: linear-gradient(135deg, #EAD392 0%, #F5ABA4 100%);
                min-height: 100vh;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .wadah {
                background: rgba(255, 255, 255, 0.4); 
                backdrop-filter: blur(12px);
                padding: 40px; 
                border-radius: 24px;
                box-shadow: 0 10px 30px rgba(186, 171, 53, 0.15); /* Bayangan bernuansa #BAAB35 */
                text-align: center;
                width: 320px;
                border: 1px solid rgba(255, 255, 255, 0.6);
            }
            h2 {
                margin-top: 0; 
                color: #BAAB35; /* Warna Utama */
                font-weight: 800;
            }
            input {
                padding: 15px; 
                margin-bottom: 20px; 
                font-size: 16px; 
                width: 100%; 
                border: none; 
                border-radius: 16px;
                box-sizing: border-box;
                outline: none;
                background: rgba(255, 255, 255, 0.7);
                color: #8c8128; /* Warna yang sedikit lebih gelap dari BAAB35 agar mudah dibaca */
                font-weight: bold;
            }
            input::placeholder {
                color: #c4ba6e;
                font-weight: normal;
            }
            button { 
                padding: 12px 20px; 
                margin: 5px; 
                font-size: 15px; 
                font-weight: bold;
                border: none; 
                border-radius: 12px; 
                cursor: pointer;
                transition: all 0.3s ease;
            }
            .btn-cek {
                background: #BAAB35; /* Warna Utama */
                color: white; 
                width: 55%;
            }
            .btn-reset {
                background: rgba(255, 255, 255, 0.5); 
                color: #BAAB35; 
                border: 2px solid #BAAB35; 
                width: 35%;
            }
            button:hover {
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(186, 171, 53, 0.3);
            }
            .hasil-box {
                margin-top: 25px;
                padding: 20px;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 16px;
                color: #8c8128;
                font-weight: bold;
                font-size: 15px;
                word-wrap: break-word; /* Mencegah angka meluber keluar kotak kalau angkanya panjang */
            }
            .angka-deret {
                color: #BAAB35;
                font-size: 22px;
                font-weight: 800;
                display: block;
                margin-top: 10px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>

        <div class="wadah">
            <h2>Deret Ganjil</h2>

            <!-- Input nilai N -->
            <input type="number" id="nilaiN" placeholder="Masukkan nilai N">

            <div>
                <!-- Tombol Tampilkan -->
                <button class="btn-cek" onclick="tampilkan()">Tampilkan</button>
                <button class="btn-reset" onclick="reset()">Reset</button>
            </div>

            <!-- Box Hasil Deret -->
            <div class="hasil-box">
                Hasil Deret:<br>
                <span id="hasilDeret" class="angka-deret">-</span>
            </div>
        </div>

        <script>
            function tampilkan() {
                // 1. Mengambil nilai input
                let N = parseInt(document.getElementById('nilaiN').value);

                // 2. Validasi (Persyaratan: Jika N < 1, tampilkan pesan)
                if (isNaN(N) || N < 1) {
                    alert('Masukkan angka positif!');
                    return;
                }

                // 3. Array untuk menampung deret angka
                let deret = [];

                // 4. Perulangan (Looping) dari 1 hingga N
                for (let i = 1; i <= N; i++) {
                    // Cek jika i adalah bilangan ganjil (sisa bagi dengan 2 tidak sama dengan 0)
                    if (i % 2 !== 0) {
                        deret.push(i);
                    }
                }

                // 5. Cetak Hasil dipisahkan dengan koma dan spasi sesuai format (1, 3, 5, 7)
                document.getElementById('hasilDeret').innerHTML = deret.join(', ');
            }

            function reset() {
                document.getElementById('nilaiN').value = '';
                document.getElementById('hasilDeret').innerHTML = '-';
            }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Profile Interaktif</title>

    <!-- Instalasi jQuery via CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

    <!-- Memuat Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4efe9;
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: #fff;
            padding: 30px;
            border: 1px solid #e5d9c5;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
        }

        .profile-section {
            flex: 1;
            min-width: 250px;
            text-align: left;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background-color: #8b5e3c;
            color: #fff;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .profile-section h2 {
            margin: 0;
            color: #5c3a21;
        }

        .profile-section .role {
            color: #6b7280;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .profile-section ul {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            color: #374151;
        }

        .profile-section li {
            margin-bottom: 8px;
        }

        
        .contact-section {
            flex: 1.5;
            min-width: 300px;
        }

        .contact-section h3 {
            margin-top: 0;
            color: #8b5e3c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #8b5e3c;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background-color: #8b5e3c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #704a2e;
        }

        .error-msg {
            color: #dc2626;
            font-size: 12px;
            display: none;
            margin-top: 5px;
        }

        .success-msg {
            color: #16a34a;
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .edit-box {
            display: none;
            background: #fdfaf6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #e5d9c5;
        }
    </style>
</head>

<body>

    <div class="container" id="mainContainer">

        <!-- Kolom Profil -->
        <div class="profile-section">
            <div class="avatar">🦭</div>
            <h2 id="profName">Nova Amelia</h2>
            <p class="role" id="profRole">Information System Student</p>
            <ul>
                <li>📍 <span id="profLoc">Pontianak, Indonesia</span></li>
                <li>✉ <span id="profEmail">novaamelia2970@gmail.com</span></li>
            </ul>
            <button id="btnUbah">🔄 Ubah Profil</button>

            <!-- Panel Edit Tersembunyi -->
            <div class="edit-box" id="editPanel">
                <input type="text" id="inputEditNama" value="Nova Amelia" style="margin-bottom:10px;">
                <input type="text" id="inputEditEmail" value="novaamelia2970@gmail.com" style="margin-bottom:10px;">
                <button id="btnSimpan" style="padding: 6px 12px; font-size: 12px;">Simpan</button>
            </div>
        </div>

        <!-- Kolom Kontak -->
        <div class="contact-section">
            <h3>💬 Tinggalkan Pesan</h3>
            <form id="formKontak">

                <div class="form-group">
                    <input type="text" id="nama" placeholder="Nama Anda">
                    <span class="error-msg" id="errNama">⚠️ Masukkan nama minimal 3 karakter</span>
                </div>

                <div class="form-group">
                    <input type="text" id="email" placeholder="Email Anda">
                    <span class="error-msg" id="errEmail">⚠️ Email tidak valid</span>
                </div>

                <div class="form-group">
                    <textarea id="pesan" placeholder="Tulis pesan minimal 10 karakter..."></textarea>
                    <span class="error-msg" id="errPesan">⚠️ Pesan minimal 10 karakter</span>
                </div>

                <button type="submit">🚀 Kirim</button>
            </form>

            <div class="success-msg" id="msgSukses">✔️ Pesan berhasil dikirim!</div>
        </div>

    </div>

    <script>
        $(document).ready(function () {

            $("#mainContainer").hover(
                function () { $(this).css("box-shadow", "0 10px 25px rgba(139, 94, 60, 0.15)"); },
                function () { $(this).css("box-shadow", "none"); }
            );
            $("#btnUbah").click(function () {
                $("#editPanel").slideToggle();

                if ($(this).text() === "🔄 Ubah Profil") {
                    $(this).text("Tutup Edit");
                } else {
                    $(this).text("🔄 Ubah Profil");
                }
            });

            // Menyimpan data profil
            $("#btnSimpan").click(function () {
                let namaBaru = $("#inputEditNama").val().trim();
                let emailBaru = $("#inputEditEmail").val().trim();

                if (namaBaru !== "") {
                    // Mengubah nama
                    $("#profName").html("<strong>" + namaBaru + "</strong>");

                    // Mengubah email
                    if (emailBaru !== "") {
                        $("#profEmail").text(emailBaru);
                    }

                    // Menutup panel edit dan mengembalikan teks tombol
                    $("#editPanel").slideToggle();
                    $("#btnUbah").text("🔄 Ubah Profil");
                }
            });

            $("#formKontak").submit(function (e) {
                e.preventDefault();

                let valid = true;

                let nama = $("#nama").val().trim();
                let email = $("#email").val().trim();
                let pesan = $("#pesan").val().trim();

                if (nama.length < 3) {
                    $("#errNama").show();
                    valid = false;
                } else {
                    $("#errNama").hide();
                }

                if (email.indexOf("@") === -1 || email.indexOf(".") === -1) {
                    $("#errEmail").show();
                    valid = false;
                } else {
                    $("#errEmail").hide();
                }

                if (pesan.length < 10) {
                    $("#errPesan").show();
                    valid = false;
                } else {
                    $("#errPesan").hide();
                }
                
                if (valid) {
                    // Menampilkan pesan sukses
                    $("#msgSukses").fadeIn(400).delay(3000).fadeOut(400);

                    // Mengosongkan form
                    $("#formKontak").trigger("reset");
                }
            });

        });
    </script>

</body>

</html>
